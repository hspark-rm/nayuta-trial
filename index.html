<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07060c">
<title>나유타 재판</title>
<style>
  /* 갈무리11: 도트 한글 글꼴, SIL OFL 1.1 (github.com/quiple/galmuri) */
  @font-face { font-family: Galmuri11; src: url(https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2) format("woff2"); }
  @font-face { font-family: Galmuri11Bold; src: url(https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2) format("woff2"); }
  html, body { margin: 0; height: 100%; background: #07060c; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  /* 캔버스는 정수배로 키워 그린 뒤 화면 크기에 맞춰 살짝 줄인다 → 휴대폰에서도 화면을 꽉 채움 */
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="game" width="320" height="180"></canvas>
<script>
  // 고친 시나리오·엔진이 휴대폰에서도 바로 반영되도록 캐시를 쓰지 않고 매번 받는다(작은 파일이라 부담 없음)
  for (const s of ['data/case1.js', 'src/game.js']) document.write(`<script src="${s}?t=${Date.now()}"><\/script>`);
</script>
</body>
</html>
